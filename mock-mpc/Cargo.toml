[package]
name = "nearkat-mock-mpc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test stand-in for NEAR's MPC signer contract's confidential key derivation. Not for production: it holds the master secret."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
sha2 = "0.9"
sha3 = "0.10"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
