[package]
name = "nearkat-nft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
# Verifies Intel TDX quotes on-chain, for collections that require a Phala app.
dcap-qvl = { version = "0.7", default-features = false, features = ["rustcrypto", "default-x509", "std"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-api = "0.8.6"
near-sandbox = { version = "0.3.16", features = ["generate"] }
cargo-near-build = { version = "0.11.5", features = ["build_internal"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
bs58 = "0.5"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
