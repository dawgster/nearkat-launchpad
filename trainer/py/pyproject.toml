[project]
name = "kat-trainer"
version = "0.1.0"
description = "Linear SVM on frozen MobileNetV3-Large features: labelled images on stdin, ONNX out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "onnx",
    "pillow",
    "onnxscript>=0.7.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "onnxruntime>=1.31.1",
    "pytest",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
