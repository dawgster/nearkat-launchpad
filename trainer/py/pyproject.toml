[project]
name = "kat-trainer"
version = "0.1.0"
description = "Small CNN trainer: labelled images on stdin, ONNX out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "onnx",
    "pillow",
    "onnxscript>=0.7.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
